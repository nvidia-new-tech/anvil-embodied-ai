# =============================================================================
# LeRobot Inference Configuration
#   smolvla_flip_pack_20260904_plus_005000 — single-arm 8 DOF, 2 cameras
# =============================================================================
# For model_zoo/smolvla_flip_pack_20260904_plus_005000 — SmolVLA finetuned on
# dataset flip_pack_20260904_plus (single-arm, 2-cam), 5000 steps, bs64.
#
# Verified against the checkpoint on 2026-09-10 with:
#   ./.venv/bin/python scripts/preflight_checkpoint.py \
#     model_zoo/smolvla_flip_pack_20260904_plus_005000 --config <this file>
#
# ── Why this is a NEW file and not inference_singlearm_flip.yaml ─────────────
#
#   That config lists THREE cameras (chest, wrist_l, wrist_r). This checkpoint
#   declares only chest + wrist_r. Sending a camera the checkpoint has no slot
#   for makes ObservationManager.has_complete_observation() wait forever and
#   inference never starts — preflight flags this as an ERROR. Do not add
#   wrist_l back for this model.
#
# ── Why the state_pinning block from inference_flip.yaml is absent ───────────
#
#   Pinning exists to neutralise a static left arm whose floored stats made it
#   a high-gain noise channel. There is no left arm here, and every one of the
#   8 dims has genuine spread (std 0.021 m on the gripper, 0.22-0.64 rad on
#   j1-j7, i.e. 12-36 deg/sigma). Nothing is degenerate, so nothing to pin.
# =============================================================================
# Parameters set via ROS2 launch args (not in this file):
#   model_path, device, control_frequency, image_height/width, echo_topic_only

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  # Verbatim from the checkpoint's anvil_config.json. SmolVLA conditions on this
  # string; a reworded one silently degrades actions.
  task_description: "Flip the package upside down."

# -----------------------------------------------------------------------------
# Inference Tuning
# -----------------------------------------------------------------------------
inference_tuning:
  act:
    n_action_steps: null
    temporal_ensemble_coeff: null

  diffusion:
    n_action_steps: null
    num_inference_steps: 10

  # RTC — used for VLA models (smolvla here), always enabled
  rtc:
    inference_delay: 10
    queue_trigger_threshold: 50
    execution_horizon: 12
    max_guidance_weight: 10.0
    prefix_attention_schedule: EXP

# -----------------------------------------------------------------------------
# Joint Configuration
# -----------------------------------------------------------------------------
joint_state_topic: "/joint_states"

joint_names:
  # Order the model emits (gripper first) — must match the training dataset.
  model_joint_order:
    - finger_joint1
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7

  # Order the ROS2 forward_position_controller expects (gripper last).
  controller_joint_order:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
    - finger_joint1

  # Single arm → 1 x 8 = 8 DOF state, matching observation.state shape [8].
  arm_mapping:
    r: right

  state_features:
    - position

# -----------------------------------------------------------------------------
# Arm Configuration
# -----------------------------------------------------------------------------
# Single-arm checkpoint: the right arm owns the WHOLE action vector, so the
# slice is [0:8] — NOT [8:16] as in the bimanual inference_flip.yaml.
arms:
  right:
    ros_prefix: "follower_r"
    command_topic: "/follower_r_forward_position_controller/commands"
    action_start: 0
    action_end: 8

# -----------------------------------------------------------------------------
# Camera Configuration
# -----------------------------------------------------------------------------
cameras:
  fps: 30.0

  # Exactly the two the checkpoint declares. wrist_l deliberately absent.
  mapping:
    "/cam_chest/image_raw/compressed": "chest"
    "/cam_wrist_r/image_raw/compressed": "wrist_r"

# -----------------------------------------------------------------------------
# Safety
# -----------------------------------------------------------------------------
# Upstream defaults, from lerobot OpenArmFollowerConfig
# (robots/openarm_follower/config_openarm_follower.py:71,105-116).
#
# max_relative_target — upstream default is None: NO per-step displacement cap.
#   Model output goes to the controller unmodified. Set a scalar to cap every
#   joint equally, or a mapping to cap per joint. A mapping must name EVERY
#   joint; upstream ensure_safe_goal_position raises on a partial one.
#
#     max_relative_target:
#       joint1: 0.1
#       ...
#       finger_joint1: 0.005     # metres, ~10 steps to close
#
# joint_limits — upstream ships defaults, but they CANNOT be copied here:
#   * key names differ: upstream uses joint_1..joint_7 / "gripper";
#     this robot uses joint1..joint7 / "finger_joint1"
#   * units differ: upstream's "gripper": (-5.0, 0.0) is negative-closed,
#     while finger_joint1 is prismatic 0..0.05 m positive-open. Copying it
#     would clamp the gripper to <= 0.0 and hold it shut permanently.
#   Fill from this robot's URDF if you want this layer; left unset it is off.
#
#     joint_limits:
#       joint1: [-3.14, 3.14]
#       finger_joint1: [0.0, 0.05]
safety:
  max_relative_target: null
  joint_limits: null
