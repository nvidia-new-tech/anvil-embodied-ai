# =============================================================================
# OpenArm MCAP to LeRobot Conversion Configuration — pack-pick-place, single-arm (8-D)
# =============================================================================
# Teleop Mode: Quest (VR Controller)  --  pack-pick-place session (2026-09-11)
#
# Right-arm only, 8-D state/action -- this session was recorded with no
# left-arm topics at all (confirmed: /joint_states, action topics, and
# camera topics only ever reference the right arm and chest/wrist_r
# cameras). Same "drop the unused arm entirely" approach as the flip-pack
# single-arm configs.
#
# Cameras: chest + wrist_r ONLY, natively 1280x720 (16:9) -- a different,
# higher-resolution rig than the flip-pack sessions (640x480). Downscaled
# ÷4 to 320x180, same no-letterbox reasoning as the bottle-handoff _16x9
# config.
# =============================================================================

robot_state_topic: "/joint_states"


# =============================================================================
# Joint Name Parsing
# =============================================================================

joint_names:
  separator: "_"

  source:
    follower: observation

  arms:
    r: right


# =============================================================================
# Action Topics (Quest Teleop)
# =============================================================================

action_topics:
  "/follower_r_forward_position_controller/commands":
    arm: "right"
    joint_order: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6", "joint7", "finger_joint1"]

action_from_observation: false


# =============================================================================
# Camera Configuration
# =============================================================================

camera_topics:
  - "/cam_chest/image_raw/compressed"
  - "/cam_wrist_r/image_raw/compressed"

camera_topic_mapping:
  "/cam_chest/image_raw/compressed": "chest"
  "/cam_wrist_r/image_raw/compressed": "wrist_r"

image_resolution: [320, 180]   # 16:9, exact ÷4 of 1280x720 -- no letterbox padding


# =============================================================================
# Feature Extraction
# =============================================================================

observation_feature_mapping:
  state: "position"
  others: []

action_feature_mapping:
  state: "position"
  others: []


# =============================================================================
# Quick Reference
# =============================================================================
#
# Output (LeRobot dataset):
#   observation.state     [8]  = [right_joints...]  (from follower)
#   action                [8]  = [right_joints...]  (from command topic)
#   observation.images.chest    [3, 180, 320]
#   observation.images.wrist_r  [3, 180, 320]
